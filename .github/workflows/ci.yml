name: CI

# No `branches:` filter. This was `branches: [main]`, which silently skipped
# the build for any pull request based on another branch -- so a stacked pull
# request got reviewed but never built. That turned blocking once main began
# requiring this check: #80 could not merge and had to be reopened as #81.
# The review workflow has never carried this filter, which is why it ran on
# that pull request when this one did not.
on:
  pull_request:
    types: [opened, synchronize, reopened]

# One build per pull request. Dropping the branch filter above means more
# pull requests reach this workflow, so superseded commits should stop paying
# for a build nobody will read. Cancelling is safe here in a way it is not
# for a deploy: nothing is published, so a half-finished build leaves nothing
# behind.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Pinned to commits, not tags -- a tag is mutable, and whoever controls
      # it controls what runs in this repository. Matches the pins used by the
      # review and deploy workflows. Update deliberately when taking a version.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.33.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Runs before the build because it is far cheaper and fails far more
      # usefully. Until this step existed the suite gated nothing: every test
      # ran only when somebody remembered to run it locally, including the ones
      # written specifically to fail if a regression came back.
      - name: Test
        run: pnpm test

      - name: Build (Cloudflare)
        run: pnpm cf:build
        env:
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
          NEXT_PUBLIC_CONVEX_SITE_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_SITE_URL }}
          NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}
