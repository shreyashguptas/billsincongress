name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Deploys run one at a time. Merging four pull requests inside a minute
# started four deploys at once and they raced; the newest code won only
# because they happened to finish in the order they started. Had they not,
# an older build would have been left serving with nothing to flag it.
#
# cancel-in-progress is deliberately FALSE here, unlike the review workflow.
# Cancelling a review wastes nothing, but cancelling a half-finished upload
# to Cloudflare could leave the site mid-swap. Queueing is also what makes
# the result correct: GitHub keeps only ONE run pending per group, so a burst
# of merges collapses to "finish the current deploy, then deploy the newest
# commit" -- which is the one that should end up live.
#
# The group is a fixed name rather than per-ref so a manual run and a push
# cannot deploy over each other either.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Pinned to commits, not tags. A tag is mutable: whoever controls it
      # controls what runs here. That matters most in this file, which is the
      # one holding the Cloudflare deploy credential. Re-resolve a tag and
      # update these lines deliberately when taking a new version.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.33.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and deploy to Cloudflare
        run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: e0ac3ff39c16f7f014db042fccaf7651
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
          NEXT_PUBLIC_CONVEX_SITE_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_SITE_URL }}
          NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}
