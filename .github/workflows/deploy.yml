name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Deploys run one at a time. Merging four pull requests inside a minute
# started four deploys at once and they raced; the newest code won only
# because they happened to finish in the order they started. Had they not,
# an older build would have been left serving with nothing to flag it.
#
# cancel-in-progress is deliberately FALSE here, unlike the review workflow.
# Cancelling a review wastes nothing, but cancelling a half-finished upload
# to Cloudflare could leave the site mid-swap. Queueing is also what makes
# the result correct: GitHub keeps only ONE run pending per group, so a burst
# of merges collapses to "finish the current deploy, then deploy the newest
# commit" -- which is the one that should end up live.
#
# The group is a fixed name rather than per-ref so a manual run and a push
# cannot deploy over each other either.
concurrency:
  group: deploy-production
  cancel-in-progress: false

# Read-only. The deploys authenticate with their own credentials (the
# Cloudflare token and the Convex deploy key), not the GitHub token, so the
# token needs nothing beyond reading the code.
permissions:
  contents: read

jobs:
  deploy:
    # `main` only, including for a manual run. The "Run workflow" button lets
    # you pick any branch, and `convex deploy` pushes the checked-out convex/
    # folder wholesale: a run from a stale branch would undo every backend
    # change merged since that branch was cut. That has happened by hand once
    # already (it wiped the saved-bills functions). Production is whatever
    # `main` says.
    if: github.ref == 'refs/heads/main'
    # The `Production` environment is what actually keeps CONVEX_DEPLOY_KEY
    # on `main`. The key is an environment secret, and the environment only
    # admits jobs running on `main` (Settings -> Environments -> Production ->
    # Deployment branches). The `if:` above can be deleted by anyone who edits
    # this file on a branch, and a manual run uses that branch's copy of the
    # file; the environment rule cannot be edited from a branch. Keep both:
    # the `if:` skips the job cleanly, the environment is the guarantee.
    environment: Production
    runs-on: ubuntu-latest
    # A normal run takes about two minutes. The limit stops a hung upload from
    # holding the deploy queue for six hours, which would block every deploy
    # behind it.
    timeout-minutes: 20
    steps:
      # Pinned to commits, not tags. A tag is mutable: whoever controls it
      # controls what runs here. That matters most in this file, which is the
      # one holding the Cloudflare and Convex deploy credentials. Re-resolve a
      # tag and update these lines deliberately when taking a new version.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.33.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The backend first, then the site. Merging used to deploy only the site,
      # and the backend waited for someone to remember `npx convex deploy`.
      # Production once ran three days behind `main` that way, telling readers
      # on a bill page about a different bill.
      #
      # Backend first because new site code usually calls new backend
      # functions, and the reverse is rarely true. If this step fails (a type
      # error, or a schema the existing data does not fit), the step below does
      # not run either, so the site never ships against a backend it expects
      # but did not get.
      #
      # It runs on every push, not only when convex/ changed. Deploying an
      # unchanged folder is harmless, and it fixes any drift, such as a manual
      # deploy from a branch, on the next merge.
      #
      # The key is set on THIS step only. The install step above runs
      # dependencies' install scripts and must never see it.
      - name: Deploy the Convex backend
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          # A missing secret would otherwise surface as a vague CLI error. A
          # preview key is worse: the CLI would deploy to a preview copy,
          # report success, and leave production untouched.
          case "$CONVEX_DEPLOY_KEY" in
            prod:*) ;;
            "") echo "::error::CONVEX_DEPLOY_KEY is empty. It must be a secret of the Production environment, and this job must be running on main. See 'Deploying Convex' in documentation/overview.md."; exit 1 ;;
            *) echo "::error::CONVEX_DEPLOY_KEY is not a production deploy key (it must start with 'prod:')."; exit 1 ;;
          esac
          pnpm exec convex deploy --yes

      - name: Build and deploy to Cloudflare
        run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: e0ac3ff39c16f7f014db042fccaf7651
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
          NEXT_PUBLIC_CONVEX_SITE_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_SITE_URL }}
          NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}
