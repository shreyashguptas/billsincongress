# Which dependencies may run install scripts. Since pnpm 11, a dependency with
# an install script that is not listed here FAILS the install (strictDepBuilds),
# so every entry is a decision: true runs the script, false skips it quietly.
allowBuilds:
  # Downloads the prebuilt posthog-cli binary that
  # scripts/posthog-self-driving-setup.ts runs.
  '@posthog/cli': true
  # Its postinstall only prints a funding message; core-js works without it.
  # Pulled in by posthog-js.
  core-js: false
  # Fetch their platform binaries (the bundler, and Cloudflare's local runtime).
  esbuild: true
  workerd: true

# Supply-chain wait: pnpm will not install any package version published
# less than 3 days ago (4320 minutes), so a hijacked or broken release has
# time to be caught and pulled before it can reach this repo. Without a
# version, `pnpm add`/`pnpm update` take the newest release that is old
# enough. Strict makes asking for a too-new version by name fail, instead of
# pnpm quietly writing an exception here. If a security fix truly cannot wait,
# add that one exact version under minimumReleaseAgeExclude with a comment
# saying why, and delete it once it is 3 days old.
minimumReleaseAge: 4320
minimumReleaseAgeStrict: true
